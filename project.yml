name: Pollen
options:
  bundleIdPrefix: com.deleev
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES

targets:
  Pollen:
    type: application
    platform: macOS
    sources:
      - path: Pollen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deleev.pollen
        PRODUCT_NAME: Pollen
        INFOPLIST_FILE: Pollen/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pollen/Pollen.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: PollenWidget
        embed: true

  PollenWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: PollenWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deleev.pollen.widget
        PRODUCT_NAME: PollenWidget
        INFOPLIST_FILE: PollenWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PollenWidget/PollenWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
